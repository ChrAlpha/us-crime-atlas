name: Official provider health

on:
  schedule:
    - cron: '17 13 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-health
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate six official city feeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check schemas, sample geometry, runtime queries, CORS, and map style
        run: pnpm run test:contracts
